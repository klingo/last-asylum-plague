<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/assets/ui/favicon.svg" />
        <title data-i18n="docTitle.settings"></title>
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <!-- The language of the app (saved in the browser). -->
            <section class="card settings-language">
                <h2 data-i18n="settings.language.heading"></h2>
                <p class="page-lead" data-i18n="settings.language.description"></p>
                <div class="field field--narrow">
                    <label for="lang-select" data-i18n="settings.language.label"></label>
                    <select id="lang-select"></select>
                </div>
            </section>

            <!-- Settings that shape every value in the app (saved in the browser, like the weekly spend). -->
            <section class="card settings-values">
                <h2 data-i18n="settings.heading"></h2>
                <p class="page-lead" data-i18n="settings.description"></p>
                <!-- One row per setting: what it does (the active state stands out) and a switch. -->
                <label class="setting-row setting-row--impact" for="count-vip-points">
                    <span class="setting-row__text">
                        <span class="setting-row__title">
                            <span data-item-id="vip_points"></span>
                            <span data-i18n="settings.countVipPoints"></span>
                            <span class="impact-badge" data-i18n="settings.impact"></span>
                        </span>
                        <span class="setting-row__state" data-state="on" data-i18n="settings.vipOn"></span>
                        <span class="setting-row__state" data-state="off" data-i18n="settings.vipOff"></span>
                    </span>
                    <input type="checkbox" class="switch" id="count-vip-points" role="switch" />
                </label>
            </section>

            <!-- Browser notifications (only while a tab of the app is open). -->
            <section class="card settings-notifications">
                <h2 data-i18n="settings.notifications.heading"></h2>
                <p class="page-lead" data-i18n="settings.notifications.description"></p>
                <label class="setting-row" for="notify-survival-battle">
                    <span class="setting-row__text">
                        <span class="setting-row__title" data-i18n="settings.notifications.survivalBattle"></span>
                        <span
                            class="setting-row__state"
                            data-state="on"
                            data-i18n="settings.notifications.survivalBattleOn"
                        ></span>
                        <span
                            class="setting-row__state"
                            data-state="off"
                            data-i18n="settings.notifications.survivalBattleOff"
                        ></span>
                    </span>
                    <input type="checkbox" class="switch" id="notify-survival-battle" role="switch" />
                </label>
                <p class="text-bad" id="notify-note" hidden></p>
            </section>

            <!-- How well the fitted worths reproduce the packs' deal % (with the valuation settings above). -->
            <section class="card" id="fit-quality">
                <h2 data-i18n="settings.quality.heading"></h2>
                <div class="mine-stats" id="fit-stats"></div>
                <p class="text-dim" data-i18n="settings.quality.worstHeading"></p>
                <ol class="fit-worst" id="fit-worst"></ol>
            </section>

            <!-- Admin (collapsed): record when events, passes and tracks run, through a GitHub workflow. -->
            <section class="card settings-admin">
                <details>
                    <summary data-i18n="settings.admin.heading"></summary>

                    <!-- Without a token: enter and check it. -->
                    <div id="admin-login">
                        <form class="form-row" id="admin-token-form">
                            <div class="field field--wide">
                                <label for="admin-token" data-i18n="settings.admin.tokenLabel"></label>
                                <input type="password" id="admin-token" autocomplete="off" spellcheck="false" />
                            </div>
                            <button type="submit" id="admin-token-save" data-i18n="settings.admin.tokenSave"></button>
                        </form>
                        <p class="text-bad" id="admin-token-note" hidden></p>
                    </div>

                    <!-- With a token: log out, then the two ways to record. -->
                    <div id="admin-session" hidden>
                        <div class="form-row">
                            <div class="field field--wide">
                                <label for="admin-token-saved" data-i18n="settings.admin.tokenLabel"></label>
                                <input type="text" id="admin-token-saved" readonly disabled />
                            </div>
                            <button type="button" class="btn-secondary" id="admin-logout"></button>
                        </div>

                        <div class="admin-confirm" id="admin-confirm" hidden>
                            <p id="admin-confirm-text"></p>
                            <div class="field__buttons">
                                <button type="button" id="admin-confirm-yes"></button>
                                <button type="button" class="btn-secondary" id="admin-confirm-no"></button>
                            </div>
                        </div>
                        <p id="admin-result" hidden></p>

                        <h3 data-i18n="settings.admin.todayHeading"></h3>
                        <ul class="admin-list" id="admin-today"></ul>

                        <h3 data-i18n="settings.admin.manualHeading"></h3>
                        <div class="form-row">
                            <div class="field field--wide">
                                <label for="admin-id" data-i18n="settings.admin.event"></label>
                                <select id="admin-id"></select>
                            </div>
                            <div class="field field--narrow">
                                <label for="admin-start" data-i18n="settings.admin.start"></label>
                                <input type="date" id="admin-start" />
                            </div>
                            <div class="field field--narrow">
                                <label for="admin-days" data-i18n="settings.admin.days"></label>
                                <input type="number" id="admin-days" min="1" step="1" />
                            </div>
                            <button type="button" id="admin-record" data-i18n="settings.admin.record"></button>
                        </div>
                    </div>
                </details>
            </section>
        </main>
        <footer class="app-footer"><span>Klingo's Companion</span></footer>
        <script type="module" src="/src/pages/settings/index.js"></script>
    </body>
</html>

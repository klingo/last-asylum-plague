<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/assets/ui/favicon.svg" />
        <title data-i18n="docTitle.seasonalPasses"></title>
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="seasonalPasses.heading"></h2>
                <p class="page-lead" data-i18n="seasonalPasses.description"></p>
                <details class="page-details">
                    <summary data-i18n="common.howItWorks"></summary>
                    <p data-i18n="seasonalPasses.details"></p>
                </details>
                <div id="valuation-panel"></div>
                <div class="form-row">
                    <div class="field field--wide">
                        <label for="pass-select" data-i18n="seasonalPasses.passLabel"></label>
                        <div class="item-picker"><button type="button" id="pass-select"></button></div>
                    </div>
                </div>
            </section>

            <section class="card">
                <!-- The pass's art, name and when it runs. -->
                <div id="pass-banner" hidden></div>
                <div id="pass-prompt" class="empty-state" data-i18n="seasonalPasses.selectPrompt"></div>
                <div id="pass-empty" class="empty-state" hidden data-i18n="seasonalPasses.empty"></div>
                <div id="pass-content" hidden>
                    <div id="pass-summary" class="plan-tiles"></div>
                    <h3 data-i18n="seasonalPasses.tiersHeading"></h3>
                    <div class="table-wrap">
                        <div id="pass-table" class="ranking-grid events-packs-grid" role="table"></div>
                    </div>
                    <p class="footnote" id="pass-note"></p>
                </div>
            </section>
        </main>
        <footer class="app-footer"><span>Klingo's Companion</span></footer>
        <script type="module" src="/src/pages/seasonal-passes.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/assets/ui/favicon.svg" />
        <title data-i18n="docTitle.calendar"></title>
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card schedule" id="schedule" hidden>
                <h2 data-i18n="calendar.schedule.heading"></h2>
                <p class="text-dim" data-i18n="calendar.schedule.lead"></p>
                <div class="schedule__body"></div>
            </section>

            <section class="card schedule schedule--rotation" id="rotation" hidden>
                <h2 data-i18n="calendar.rotation.heading"></h2>
                <p class="text-dim" data-i18n="calendar.rotation.lead"></p>
                <div class="schedule__body"></div>
            </section>

            <!-- Event rotations (Survival Battle): one chart each, drawn by calendar.js. -->
            <div id="event-rotations"></div>
        </main>
        <footer class="app-footer"><span>Klingo's Companion</span></footer>
        <script type="module" src="/src/pages/calendar/index.js"></script>
    </body>
</html>

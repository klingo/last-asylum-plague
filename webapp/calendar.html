<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/assets/ui/favicon.svg" />
        <title data-i18n="docTitle.calendar"></title>
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <!-- Each card collapses (ui/collapsible.js): its heading is the summary of a details. -->
            <section class="card schedule" id="schedule" hidden>
                <details data-section="schedule" open>
                    <summary class="card-toggle"><h2 data-i18n="calendar.schedule.heading"></h2></summary>
                    <p class="text-dim" data-i18n="calendar.schedule.lead"></p>
                    <div class="schedule__body"></div>
                </details>
            </section>

            <section class="card schedule schedule--rotation" id="rotation" hidden>
                <details data-section="rotation" open>
                    <summary class="card-toggle"><h2 data-i18n="calendar.rotation.heading"></h2></summary>
                    <p class="text-dim" data-i18n="calendar.rotation.lead"></p>
                    <div class="schedule__body"></div>
                </details>
            </section>

            <!-- Event rotations (Survival Battle, Alliance Duel): one chart each, drawn by calendar.js. -->
            <div id="event-rotations"></div>

            <!-- The Kingdom War (weeks, break, Royal City Scramble), drawn by calendar.js. -->
            <div id="kingdom-war"></div>
        </main>
        <footer class="app-footer"><span>Klingo's Companion</span></footer>
        <script type="module" src="/src/pages/calendar/index.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.choices"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="choices.heading"></h2>
                <p class="page-lead" data-i18n="choices.description"></p>
                <details class="page-details">
                    <summary data-i18n="common.howItWorks"></summary>
                    <p data-i18n="choices.details"></p>
                </details>
                <div id="valuation-panel"></div>
                <form id="choices-form">
                    <div class="form-row">
                        <div class="field field--item">
                            <label for="item-search" data-i18n="choices.itemLabel"></label>
                            <div class="item-picker"><button type="button" id="item-search"></button></div>
                        </div>
                        <div class="field field--reset">
                            <button
                                type="button"
                                id="reset-btn"
                                class="btn-secondary"
                                data-i18n="common.reset"
                            ></button>
                        </div>
                    </div>
                </form>
            </section>

            <section class="card" id="options-card" hidden>
                <h2 data-i18n="choices.optionsHeading"></h2>
                <p class="text-dim" data-i18n="choices.optionsDescription"></p>
                <p class="summary-line" id="options-meta"></p>
                <p class="summary-line" id="options-select-hint" hidden></p>
                <div id="options-empty" class="empty-state" hidden data-i18n="choices.optionsEmpty"></div>
                <div class="table-wrap"><table id="options-table"></table></div>
            </section>
        </main>
        <footer class="app-footer"><span data-i18n="footer.choices"></span></footer>
        <script type="module" src="/src/pages/choices.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.compare"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="compare.heading"></h2>
                <p class="text-dim" data-i18n="compare.description"></p>
                <div id="valuation-panel"></div>
                <div class="compare-columns">
                    <div class="compare-column">
                        <div class="form-row">
                            <div class="field field--item">
                                <label for="a-search"
                                    ><span class="compare-bar__swatch compare-bar__swatch--a"></span>
                                    <span data-i18n="compare.sideA"></span
                                ></label>
                                <div class="item-combobox">
                                    <input
                                        type="text"
                                        id="a-search"
                                        class="item-combobox__input"
                                        role="combobox"
                                        aria-expanded="false"
                                        aria-autocomplete="list"
                                        aria-controls="a-listbox"
                                        autocomplete="off"
                                        data-i18n-placeholder="compare.searchPlaceholder"
                                    />
                                    <button
                                        type="button"
                                        id="a-search-clear"
                                        class="item-combobox__clear"
                                        tabindex="-1"
                                        hidden
                                    >
                                        &times;
                                    </button>
                                    <div class="item-combobox__panel" id="a-listbox" role="listbox" hidden></div>
                                </div>
                            </div>
                            <div class="field field--narrow">
                                <label for="a-amount" data-i18n="compare.amount"></label>
                                <input id="a-amount" type="number" min="1" step="1" value="1" />
                            </div>
                        </div>
                    </div>
                    <div class="compare-column">
                        <div class="form-row">
                            <div class="field field--item">
                                <label for="b-search"
                                    ><span class="compare-bar__swatch compare-bar__swatch--b"></span>
                                    <span data-i18n="compare.sideB"></span
                                ></label>
                                <div class="item-combobox">
                                    <input
                                        type="text"
                                        id="b-search"
                                        class="item-combobox__input"
                                        role="combobox"
                                        aria-expanded="false"
                                        aria-autocomplete="list"
                                        aria-controls="b-listbox"
                                        autocomplete="off"
                                        data-i18n-placeholder="compare.searchPlaceholder"
                                    />
                                    <button
                                        type="button"
                                        id="b-search-clear"
                                        class="item-combobox__clear"
                                        tabindex="-1"
                                        hidden
                                    >
                                        &times;
                                    </button>
                                    <div class="item-combobox__panel" id="b-listbox" role="listbox" hidden></div>
                                </div>
                            </div>
                            <div class="field field--narrow">
                                <label for="b-amount" data-i18n="compare.amount"></label>
                                <input id="b-amount" type="number" min="1" step="1" value="1" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="field field--narrow">
                        <label for="days-input" data-i18n="compare.daysLabel"></label>
                        <input id="days-input" type="number" min="1" step="1" value="7" />
                    </div>
                </div>
            </section>

            <section class="card" id="result-card" hidden>
                <h2 data-i18n="compare.resultHeading"></h2>
                <div class="compare-bar" id="compare-bar"></div>
                <p class="summary-line" id="verdict"></p>
                <div class="table-wrap"><table id="compare-table" class="compare-table"></table></div>
                <p class="footnote" id="compare-note"></p>
            </section>
        </main>
        <footer class="app-footer" data-i18n="footer.compare"></footer>
        <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
            <div class="spinner"></div>
        </div>
        <script type="module" src="/src/compare.js"></script>
    </body>
</html>

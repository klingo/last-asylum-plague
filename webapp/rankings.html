<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.rankings"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="rankings.heading"></h2>
                <p class="text-dim" data-i18n="rankings.description"></p>
                <div id="valuation-panel"></div>
                <div class="form-row">
                    <div class="field field--wide">
                        <label for="search-input" data-i18n="rankings.searchLabel"></label>
                        <input id="search-input" type="search" data-i18n-placeholder="rankings.searchPlaceholder" />
                    </div>
                </div>
                <p class="summary-line" id="ranking-meta"></p>
            </section>

            <section class="card">
                <div class="table-wrap"><div id="ranking-table" class="ranking-grid" role="table"></div></div>
                <div id="ranking-empty" class="empty-state" hidden data-i18n="rankings.empty"></div>
            </section>
        </main>
        <footer class="app-footer" data-i18n="footer.rankings"></footer>
        <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
            <div class="spinner"></div>
        </div>
        <script type="module" src="/src/rankings.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.rankings"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="rankings.heading"></h2>
                <p class="page-lead" data-i18n="rankings.description"></p>
                <details class="page-details">
                    <summary data-i18n="common.howItWorks"></summary>
                    <p data-i18n="rankings.details"></p>
                </details>
                <div id="valuation-panel"></div>
                <div class="form-row">
                    <div class="field field--wide">
                        <label for="search-input" data-i18n="rankings.searchLabel"></label>
                        <input id="search-input" type="search" data-i18n-placeholder="rankings.searchPlaceholder" />
                    </div>
                </div>
                <div class="form-row form-row--top">
                    <div class="field">
                        <span class="field-label" data-i18n="rankings.show"></span>
                        <div class="toggle-chips" id="show-mode"></div>
                    </div>
                    <div class="field field--wide">
                        <span class="field-label" data-i18n="rankings.typeFilter"></span>
                        <div class="toggle-chips" id="type-filter"></div>
                    </div>
                </div>
                <p class="summary-line" id="ranking-meta"></p>
            </section>

            <section class="card">
                <div class="table-wrap"><div id="ranking-table" class="ranking-grid ranking-grid--rankings" role="table"></div></div>
                <div id="ranking-empty" class="empty-state" hidden data-i18n="rankings.empty"></div>
            </section>
        </main>
        <footer class="app-footer"><span data-i18n="footer.rankings"></span></footer>
        <script type="module" src="/src/pages/rankings.js"></script>
    </body>
</html>

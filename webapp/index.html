<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.welcome"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="welcome.heading"></h2>
                <p class="text-dim" data-i18n="welcome.intro"></p>
            </section>

            <section class="welcome-group">
                <h2 data-i18n="nav.groups.shop"></h2>
                <div class="welcome-grid">
                    <a class="welcome-card" href="rankings.html">
                        <h3 data-i18n="nav.rankings"></h3>
                        <p data-i18n="welcome.rankingsDescription"></p>
                    </a>
                    <a class="welcome-card" href="spend-rewards.html">
                        <h3 data-i18n="nav.spendRewards"></h3>
                        <p data-i18n="welcome.spendRewardsDescription"></p>
                    </a>
                </div>
            </section>

            <section class="welcome-group">
                <h2 data-i18n="nav.groups.events"></h2>
                <div class="welcome-grid">
                    <a class="welcome-card" href="calendar.html">
                        <h3 data-i18n="nav.calendar"></h3>
                        <p data-i18n="welcome.calendarDescription"></p>
                    </a>
                    <a class="welcome-card" href="events.html">
                        <h3 data-i18n="nav.eventPlan"></h3>
                        <p data-i18n="welcome.eventsDescription"></p>
                    </a>
                </div>
            </section>

            <section class="welcome-group">
                <h2 data-i18n="nav.groups.items"></h2>
                <div class="welcome-grid">
                    <a class="welcome-card" href="items.html">
                        <h3 data-i18n="nav.items"></h3>
                        <p data-i18n="welcome.itemsDescription"></p>
                    </a>
                    <a class="welcome-card" href="sources.html">
                        <h3 data-i18n="nav.sources"></h3>
                        <p data-i18n="welcome.sourcesDescription"></p>
                    </a>
                    <a class="welcome-card" href="choices.html">
                        <h3 data-i18n="nav.choices"></h3>
                        <p data-i18n="welcome.choicesDescription"></p>
                    </a>
                    <a class="welcome-card" href="compare.html">
                        <h3 data-i18n="nav.compare"></h3>
                        <p data-i18n="welcome.compareDescription"></p>
                    </a>
                </div>
            </section>

            <section class="welcome-group">
                <h2 data-i18n="nav.groups.heroes"></h2>
                <div class="welcome-grid">
                    <a class="welcome-card" href="gear.html">
                        <h3 data-i18n="nav.gear"></h3>
                        <p data-i18n="welcome.gearDescription"></p>
                    </a>
                </div>
            </section>

            <!-- Settings that shape every value in the app (saved in the browser, like the weekly spend). -->
            <section class="card welcome-settings">
                <h2 data-i18n="welcome.settings.heading"></h2>
                <!-- One row per setting: what it does (the active state stands out) and a switch. -->
                <label class="setting-row setting-row--impact" for="count-vip-points">
                    <span class="setting-row__text">
                        <span class="setting-row__title">
                            <span data-item-id="vip_points"></span>
                            <span data-i18n="welcome.settings.countVipPoints"></span>
                            <span class="impact-badge" data-i18n="welcome.settings.impact"></span>
                        </span>
                        <span class="setting-row__state" data-state="on" data-i18n="welcome.settings.vipOn"></span>
                        <span class="setting-row__state" data-state="off" data-i18n="welcome.settings.vipOff"></span>
                    </span>
                    <input type="checkbox" class="switch" id="count-vip-points" role="switch" />
                </label>
            </section>
        </main>
        <footer class="app-footer"><span data-i18n="footer.welcome"></span></footer>
        <script type="module" src="/src/pages/welcome.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.welcome"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="today.heading"></h2>
                <p class="page-lead" data-i18n="today.description"></p>
                <details class="page-details">
                    <summary data-i18n="common.howItWorks"></summary>
                    <ul class="page-details__list">
                        <li>
                            <strong
                                ><span data-i18n="today.runningHeading"></span> /
                                <span data-i18n="today.soonHeading"></span></strong
                            >:
                            <span data-i18n="today.how.schedule"></span>
                        </li>
                        <li>
                            <strong data-i18n="today.planHeading"></strong>: <span data-i18n="today.how.plan"></span>
                        </li>
                        <li>
                            <strong data-i18n="today.offersHeading"></strong>:
                            <span data-i18n="today.how.offers"></span>
                        </li>
                    </ul>
                </details>
                <div id="valuation-panel"></div>
            </section>

            <!-- What runs today and what starts soon (art, name, countdown), each entry linking to its page. -->
            <section class="card" id="schedule-card">
                <h3 data-i18n="today.runningHeading"></h3>
                <div id="running-list" class="today-list"></div>
                <h3 data-i18n="today.soonHeading"></h3>
                <div id="soon-list" class="today-list"></div>
            </section>

            <section class="card">
                <h3 data-i18n="today.planHeading"></h3>
                <p class="text-dim" id="plan-summary"></p>
                <div id="plan-tiles" class="plan-tiles"></div>
                <p class="footnote" data-i18n="today.planNote"></p>
            </section>

            <section class="card">
                <h3 data-i18n="today.offersHeading"></h3>
                <p class="text-dim" id="offers-empty" hidden data-i18n="today.offersEmpty"></p>
                <div class="table-wrap" id="offers-wrap">
                    <div id="offers-table" class="ranking-grid today-offers-grid" role="table"></div>
                </div>
            </section>
        </main>
        <footer class="app-footer"><span>Klingo's Companion</span></footer>
        <script type="module" src="/src/pages/today.js"></script>
    </body>
</html>

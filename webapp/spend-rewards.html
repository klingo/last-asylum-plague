<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.spendRewards"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="spendRewards.heading"></h2>
                <p class="page-lead" data-i18n="spendRewards.description"></p>
                <details class="page-details">
                    <summary data-i18n="common.howItWorks"></summary>
                    <p data-i18n="spendRewards.details"></p>
                </details>
                <div id="valuation-panel"></div>
                <div class="form-row">
                    <div class="field field--wide">
                        <label for="track-select" data-i18n="spendRewards.trackLabel"></label>
                        <div class="item-picker"><button type="button" id="track-select"></button></div>
                    </div>
                </div>
            </section>

            <section class="card">
                <!-- The track's art, name and when it runs (its tiers only count while it does). -->
                <div id="track-banner" hidden></div>
                <div id="tiers-prompt" class="empty-state" data-i18n="spendRewards.selectPrompt"></div>
                <div id="tiers-empty" class="empty-state" hidden data-i18n="spendRewards.empty"></div>
                <div id="tiers-wrap" class="table-wrap" hidden>
                    <div id="tiers-table" class="spend-reward-grid" role="table"></div>
                </div>
                <p class="footnote" id="tiers-note" hidden></p>
            </section>
        </main>
        <footer class="app-footer"><span data-i18n="footer.spendRewards"></span></footer>
        <script type="module" src="/src/pages/spend-rewards.js"></script>
    </body>
</html>

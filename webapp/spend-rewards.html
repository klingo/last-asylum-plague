<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.spendRewards"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="spendRewards.heading"></h2>
                <p class="text-dim" data-i18n="spendRewards.description"></p>
                <div class="form-row">
                    <div class="field field--wide">
                        <label for="track-select" data-i18n="spendRewards.trackLabel"></label>
                        <select id="track-select"></select>
                    </div>
                    <div class="field">
                        <span class="field-label" data-i18n="spendRewards.fallbackLabel"></span>
                        <label class="checkbox-label">
                            <input type="checkbox" id="fallback-checkbox" />
                            <span data-i18n="spendRewards.fallbackCheckboxText"></span>
                        </label>
                    </div>
                </div>
            </section>

            <section class="card">
                <div id="tiers-prompt" class="empty-state" data-i18n="spendRewards.selectPrompt"></div>
                <div id="tiers-empty" class="empty-state" hidden data-i18n="spendRewards.empty"></div>
                <div id="tiers-wrap" class="table-wrap" hidden><div id="tiers-table" class="spend-reward-grid" role="table"></div></div>
                <p class="footnote" id="tiers-note" hidden></p>
            </section>
        </main>
        <footer class="app-footer" data-i18n="footer.spendRewards"></footer>
        <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
            <div class="spinner"></div>
        </div>
        <script type="module" src="/src/spend-rewards.js"></script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.items"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="items.heading"></h2>
                <p class="page-lead" data-i18n="items.description"></p>
                <details class="page-details">
                    <summary data-i18n="common.howItWorks"></summary>
                    <p data-i18n="items.details"></p>
                </details>
                <ul class="text-dim explainer">
                    <li data-i18n="items.explainUnknown"></li>
                    <li data-i18n="items.explainUncertain"></li>
                </ul>
                <div class="form-row">
                    <div class="field field--wide">
                        <label for="search-input" data-i18n="items.searchLabel"></label>
                        <input id="search-input" type="search" data-i18n-placeholder="items.searchPlaceholder" />
                    </div>
                    <div class="field">
                        <span class="field-label" data-i18n="items.showLabel"></span>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="changed-only" />
                                <span data-i18n="items.changedOnly"></span>
                            </label>
                        </div>
                    </div>
                    <div class="field field--reset">
                        <!-- Reset; export / import the priorities as a file, to share them. -->
                        <div class="field__buttons">
                            <button
                                type="button"
                                id="reset-priorities"
                                class="btn-secondary"
                                data-i18n="items.reset"
                            ></button>
                            <button
                                type="button"
                                id="export-priorities"
                                class="btn-secondary"
                                data-i18n="items.export"
                            ></button>
                            <button
                                type="button"
                                id="import-priorities"
                                class="btn-secondary"
                                data-i18n="items.import"
                            ></button>
                            <input type="file" id="import-file" accept=".json,application/json" hidden />
                        </div>
                    </div>
                </div>
                <p class="footnote" id="priorities-file-note" hidden></p>
                <p class="summary-line" id="items-summary"></p>
            </section>

            <section class="card">
                <nav class="category-jump" id="category-jump"></nav>
                <div class="table-wrap"><table id="items-table"></table></div>
                <div id="items-empty" class="empty-state" hidden data-i18n="items.empty"></div>
                <p class="footnote" data-i18n="items.footnote"></p>
            </section>
        </main>
        <footer class="app-footer"><span data-i18n="footer.items"></span></footer>
        <script type="module" src="/src/pages/items.js"></script>
    </body>
</html>

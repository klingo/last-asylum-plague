<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="docTitle.events"></title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="app-header"></header>
        <main>
            <section class="card">
                <h2 data-i18n="events.heading"></h2>
                <p class="page-lead" data-i18n="events.description"></p>
                <details class="page-details">
                    <summary data-i18n="common.howItWorks"></summary>
                    <p data-i18n="events.details"></p>
                </details>
                <div id="valuation-panel"></div>
                <div class="form-row">
                    <div class="field field--wide">
                        <span class="field-label" id="event-tabs-label" data-i18n="events.eventLabel"></span>
                        <div class="toggle-chips" id="event-tabs" role="group" aria-labelledby="event-tabs-label"></div>
                    </div>
                </div>
                <p class="footnote">
                    <span data-i18n="events.tickHint"></span>
                    <button type="button" class="btn-secondary btn-small" id="choose-events" data-i18n="events.chooseEvents"></button>
                </p>
            </section>

            <section class="card" id="event-prompt-card">
                <div class="empty-state" data-i18n="events.selectPrompt"></div>
            </section>

            <section class="card" id="plan-card" hidden>
                <!-- The event's art, name and when it runs (none for the VIP Shop). -->
                <div id="event-banner" hidden></div>
                <h3 data-i18n="events.planHeading"></h3>
                <!-- Options of this plan. Each sits in a plain wrapper, so [hidden] isn't overridden by .field. -->
                <div class="form-row form-row--top">
                    <!-- VIP Shop only: diamonds from outside the packs. -->
                    <div id="extra-diamonds-field" hidden>
                        <div class="field field--narrow">
                            <label for="extra-diamonds" data-i18n="events.extraDiamonds"></label>
                            <input id="extra-diamonds" type="number" min="0" step="1000" />
                        </div>
                    </div>
                    <!-- Events with packs: extra Banknotes only for this event, and exceeding its pack limits. -->
                    <div id="extra-banknotes-field" hidden>
                        <div class="field field--narrow">
                            <label for="extra-banknotes" data-i18n="events.extraBanknotes"></label>
                            <input id="extra-banknotes" type="number" min="0" step="1000" />
                        </div>
                    </div>
                    <div id="exceed-field" hidden>
                        <div class="field">
                            <span class="field-label" data-i18n="events.optionsLabel"></span>
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="exceed-limits" />
                                    <span data-i18n="events.exceedLimits"></span>
                                    <span id="exceed-limits-info"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="text-warn" id="exceed-note" hidden data-i18n="events.exceedNote"></p>
                <p id="lock-note" hidden></p>
                <div id="event-summary" class="plan-tiles"></div>
                <div id="shop-section" hidden>
                    <h3 id="shop-heading"></h3>
                    <p class="text-dim" id="shop-note" hidden data-i18n="events.randomOffersNote"></p>
                    <div class="table-wrap">
                        <div id="shop-table" class="ranking-grid events-shop-grid" role="table"></div>
                    </div>
                </div>
            </section>

            <section class="card" id="steps-card" hidden>
                <h3 data-i18n="events.stepsHeading"></h3>
                <div class="table-wrap">
                    <div id="steps-table" class="ranking-grid events-steps-grid" role="table"></div>
                </div>
                <p class="footnote" id="steps-note"></p>
            </section>
        </main>
        <footer class="app-footer"><span data-i18n="footer.events"></span></footer>
        <script type="module" src="/src/pages/events.js"></script>
    </body>
</html>

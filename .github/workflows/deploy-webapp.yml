name: Verify and deploy webapp

on:
    push:
        branches: [master]
    # The checks below also run on every PR into master (make them required in the branch protection).
    pull_request:
        branches: [master]
    workflow_dispatch: {}

permissions:
    contents: read
    pages: write
    id-token: write

# Only allow one concurrent deployment, cancelling in-progress runs. A PR has its own group, so its checks can
# neither cancel a deployment nor be cancelled by one.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
    cancel-in-progress: true

jobs:
    verify-data:
        runs-on: ubuntu-latest
        continue-on-error: false
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Verify pack data
              run: npm run verify-data

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Test
              run: npm test

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build the webapp
              run: npm run webapp:build

            # Only a deployment needs the Pages artifact; on a PR the build itself is the check.
            - name: Setup Pages
              if: github.event_name != 'pull_request'
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: webapp/dist

    deploy:
        needs: [build, lint, test]
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

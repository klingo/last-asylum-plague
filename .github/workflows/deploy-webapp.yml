name: Verify and deploy webapp

on:
    push:
        branches: [master]
        # The local helper tools (tools/) are not part of the site: a push that only touches them deploys nothing.
        # (Not on the PR trigger: a required check that never runs would block a tools-only PR.)
        paths-ignore: ['tools/**']
    # The checks below also run on every PR into master (make them required in the branch protection).
    pull_request:
        branches: [master]
    workflow_dispatch: {}

# Least privilege: the jobs only read the repository; the deployment alone may write to Pages.
permissions:
    contents: read

# Only allow one concurrent deployment, cancelling in-progress runs. A PR has its own group, so its checks can
# neither cancel a deployment nor be cancelled by one.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
    cancel-in-progress: true

jobs:
    verify-data:
        runs-on: ubuntu-latest
        continue-on-error: false
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup the project
              uses: ./.github/actions/setup

            - name: Verify pack data
              run: npm run verify-data

    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup the project
              uses: ./.github/actions/setup

            - name: Lint
              run: npm run lint

            - name: Check the formatting
              run: npm run format:check

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup the project
              uses: ./.github/actions/setup

            # The coverage run is the test run: it fails below the thresholds in package.json.
            - name: Test with coverage
              run: npm run test:coverage

            - name: Coverage summary
              if: always()
              run: |
                  {
                      echo '### Test coverage'
                      echo '```'
                      sed -n '/start of coverage report/,/end of coverage report/p' coverage/report.txt
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: coverage/lcov.info

    build:
        runs-on: ubuntu-latest
        # `pages: read`: configure-pages looks up the site's settings.
        permissions:
            contents: read
            pages: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup the project
              uses: ./.github/actions/setup

            - name: Build the webapp
              run: npm run webapp:build

            # Only a deployment needs the Pages artifact; on a PR the build itself is the check.
            - name: Setup Pages
              if: github.event_name != 'pull_request'
              uses: actions/configure-pages@v6

            - name: Upload Pages artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: webapp/dist

    deploy:
        needs: [verify-data, build, lint, test]
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

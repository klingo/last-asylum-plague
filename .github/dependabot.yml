# Dependabot version updates, weekly: the npm packages (minor and patch updates in one pull request) and the
# GitHub Actions the workflows use. Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      # The local composite action under .github/actions is picked up as well.
      directories: [/, /.github/actions/*]
      schedule:
          interval: weekly

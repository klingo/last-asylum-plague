name: Set up the project
description: Node.js 24 with the npm cache, and the dependencies installed (run after the checkout).

runs:
    using: composite
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
              node-version: 24
              cache: npm

        - name: Install dependencies
          shell: bash
          run: npm ci
